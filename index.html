<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Discover popular movies and TV shows. Browse, search, and explore detailed information about your favorite entertainment."
    />

    <!-- Open Graph Meta Tags for Social Sharing -->
    <meta property="og:title" content="Flixx - Discover Movies & TV Shows" />
    <meta
      property="og:description"
      content="Browse popular movies and TV shows with detailed information, ratings, and more."
    />
    <meta property="og:type" content="website" />

    <!-- favicon -->
    <link rel="shortcut icon" href="./images/favicon.svg" type="image/x-icon" />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap"
      rel="stylesheet"
    />

    <!-- swiper css -->
    <link rel="stylesheet" href="vendor/swiper.css" />

    <!-- font awesone -->
    <link rel="stylesheet" href="vendor/fontawesome.css" />

    <!-- style css -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- spinner css -->
    <link rel="stylesheet" href="css/spinner.css" />

    <!-- swiper js -->
    <script src="vendor/swiper.js"></script>

    <!-- js link -->
    <script src="js/app.js" type="module" defer></script>
    <title>Flixx - Discover Movies & TV Shows</title>
  </head>
  <body>
    <!-- header -->
    <header class="main-header">
      <div class="container">
        <div class="logo"><a href="/">FLIXX</a></div>
        <nav>
          <ul>
            <li>
              <a class="nav-link" href="/">Movies</a>
            </li>
            <li>
              <a class="nav-link" href="/shows.html">TV Shows</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Now Playing Section -->
    <section class="now-playing">
      <h2>Now Playing</h2>
      <div class="swiper">
        <div class="swiper-wrapper"></div>
      </div>
    </section>

    <!-- Search Movies -->
    <section class="search">
      <div class="container">
        <div id="alert"></div>
        <form action="/search.html" class="search-form">
          <!-- movies and shows radio box -->
          <div class="search-radio">
            <input type="radio" id="movie" name="type" value="movie" checked />
            <label for="movie">Movies</label>
            <input type="radio" id="tv" name="type" value="tv" />
            <label for="tv">TV Shows</label>
          </div>

          <div class="search-flex">
            <input
              type="text"
              name="search-term"
              id="search-term"
              placeholder="Enter search term"
            />
            <button class="btn" type="submit" aria-label="Search">
              <i class="fas fa-search"></i>
            </button>
          </div>
        </form>
      </div>
    </section>

    <!-- Popular Movies -->
    <section class="container">
      <h2>Popular Movies</h2>
      <div id="popular-movies" class="grid"></div>
    </section>

    <!-- Footer -->
    <footer class="main-footer">
      <div class="container">
        <div class="logo"><span>FLIXX</span></div>
        <div class="social-links">
          <a
            href="https://www.facebook.com"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Facebook"
          >
            <i class="fab fa-facebook-f"></i>
          </a>

          <a
            href="https://www.twitter.com"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Twitter"
          >
            <i class="fab fa-twitter"></i>
          </a>

          <a
            href="https://www.instagram.com"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
          >
            <i class="fab fa-instagram"></i>
          </a>
        </div>
      </div>
    </footer>

    <!-- spinner -->
    <div class="spinner"></div>
  </body>
</html>
