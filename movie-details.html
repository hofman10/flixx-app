<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="View detailed information about movies including ratings, cast, budget, and more."
    />
    <!-- favicon -->
    <link rel="shortcut icon" href="./images/favicon.svg" type="image/x-icon" />

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap"
      rel="stylesheet"
    />

    <!-- font awesone -->
    <link rel="stylesheet" href="vendor/fontawesome.css" />

    <!--style css -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- spinner css -->
    <link rel="stylesheet" href="css/spinner.css" />

    <!-- js link -->
    <script src="js/app.js" type="module" defer></script>
    <title>Flixx | Movie Details</title>
  </head>
  <body>
    <!-- header -->
    <header class="main-header">
      <div class="container">
        <div class="logo"><a href="/">FLIXX</a></div>
        <nav>
          <ul>
            <li>
              <a class="nav-link" href="/">Movies</a>
            </li>
            <li>
              <a class="nav-link" href="/shows.html">TV Shows</a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- Movie Details -->
    <section class="container">
      <div class="back">
        <a class="btn" href="/">Back To Movies</a>
      </div>

      <!-- Movie Details Output -->
      <div id="movie-details"></div>
    </section>

    <!-- Footer -->
    <footer class="main-footer">
      <div class="container">
        <div class="logo">
          <a href="#"><span>FLIXX</span></a>
        </div>
        <div class="social-links">
          <a
            href="https://www.facebook.com"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Facebook"
          >
            <i class="fab fa-facebook-f"></i>
          </a>

          <a
            href="https://www.twitter.com"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Twitter"
          >
            <i class="fab fa-twitter"></i>
          </a>

          <a
            href="https://www.instagram.com"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
          >
            <i class="fab fa-instagram"></i>
          </a>
        </div>
      </div>
    </footer>

    <!-- spinner -->
    <div class="spinner"></div>
  </body>
</html>
